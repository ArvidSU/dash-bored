schemaVersion: 1
name: dash-bored feature sandbox
root:
  id: dogfood-stack
  component: "@dash-bored/stack"
  props:
    gap: medium
  slots:
    children:
      - id: dogfood-notes
        component: "@dash-bored/markdown"
        props:
          content: |
            # Feature sandbox

            This standalone bundle is linked from the main cockpit. It proves that a
            dashboard can be composed as a component while keeping its own config,
            lock file, and component directory.

            Focus this panel and edit it to exercise bundle-local structural editing.
      - id: dogfood-static-chart-card
        component: "@dash-bored/card"
        props:
          title: Static chart
          description: A multi-series chart declared entirely in dashboard YAML.
        slots:
          children:
            - id: dogfood-static-chart
              component: "@dash-bored/chart"
              props:
                title: Weekly workflow throughput
                type: bar
                labels:
                  - Mon
                  - Tue
                  - Wed
                  - Thu
                  - Fri
                series:
                  - label: Checks passed
                    color: "#70e2a0"
                    values: [18, 24, 21, 29, 34]
                  - label: Checks skipped
                    color: "#f4c66b"
                    values: [4, 3, 5, 2, 1]
      - id: dogfood-live-chart-card
        component: "@dash-bored/card"
        props:
          title: Live chart
          description: Polls a local JSON endpoint every four seconds and pauses in hidden tabs.
        slots:
          children:
            - id: dogfood-live-chart
              component: "@dash-bored/live-chart"
              props:
                title: Renderer activity sample
                endpoint: /dash-bored-chart-fixture.json
                pollIntervalMs: 4000
                maxPoints: 30
      - id: dogfood-status
        component: "@dash-bored/status"
        props:
          label: Config-link boundary
          state: healthy
          detail: This content is loaded from dash-bored/dogfood/dash-bored.yaml.
      - id: dogfood-env
        component: "@dash-bored/env"
        props:
          path: .env.worktree
