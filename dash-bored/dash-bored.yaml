schemaVersion: 2
name: Dash Bored
icon: ../assets/icon.svg
root:
  id: project-cockpit
  component: "@dash-bored/tabs"
  children:
    type: managed
    items:
      - metadata:
          label: Overview
        node:
          id: overview
          component: "@dash-bored/group"
          children:
            type: tiled
            layout:
              type: split
              axis: vertical
              ratio: 0.5
              first:
                type: child
                child:
                  node:
                    id: overview-intro
                    component: "@dash-bored/markdown"
                    props:
                      content: |
                        # dash-bored

                        A local-first project cockpit for composing project workflows from
                        small components. Use this dashboard to run the normal development
                        loop, inspect the project contract, and exercise the runtime itself.

                        Press **Command-K** to find app, command, and local-component
                        actions from one place. You can also search for any dashboard
                        node and focus it as the temporary dashboard root.
              second:
                type: split
                axis: vertical
                ratio: 0.15
                first:
                  type: child
                  child:
                    node:
                      id: command-palette-navigation-card
                      component: "@dash-bored/card"
                      props:
                        title: Command palette navigation
                        description: Focus any dashboard node without hunting through nested panels.
                      children:
                        type: tiled
                        layout:
                          type: child
                          child:
                            node:
                              id: command-palette-navigation-help
                              component: "@dash-bored/markdown"
                              props:
                                content: |
                                  ### Focus any node

                                  Open the command palette and search for **Focus** to jump to
                                  a component or return to the full dashboard. The focus is
                                  temporary and does not change the YAML configuration.
                second:
                  type: split
                  axis: vertical
                  ratio: 0.5
                  first:
                    type: child
                    child:
                      node:
                        id: overview-layout
                        component: "@dash-bored/group"
                        children:
                          type: tiled
                          layout:
                            type: split
                            axis: horizontal
                            ratio: 0.5
                            first:
                              type: child
                              child:
                                node:
                                  id: project-pulse-card
                                  component: "@dash-bored/card"
                                  props:
                                    title: Project pulse
                                    description: A project-defined component that reads the local package manifest.
                                  children:
                                    type: tiled
                                    layout:
                                      type: child
                                      child:
                                        node:
                                          id: project-pulse
                                          component: ./components/project-pulse
                                          props:
                                            packageFile: package.json
                            second:
                              type: child
                              child:
                                node:
                                  id: dashboard-capabilities-card
                                  component: "@dash-bored/card"
                                  props:
                                    title: Dashboard capabilities
                                    description: Trust gates the project-owned runtime features below.
                                  children:
                                    type: tiled
                                    layout:
                                      type: split
                                      axis: vertical
                                      ratio: 0.5
                                      first:
                                        type: child
                                        child:
                                          node:
                                            id: status-config
                                            component: "@dash-bored/status"
                                            props:
                                              label: YAML configuration
                                              state: healthy
                                              detail: Project-owned and validated on each reload.
                                      second:
                                        type: split
                                        axis: vertical
                                        ratio: 0.5
                                        first:
                                          type: child
                                          child:
                                            node:
                                              id: status-local-components
                                              component: "@dash-bored/status"
                                              props:
                                                label: Local components
                                                state: healthy
                                                detail: The Project pulse card is compiled from this repository.
                                        second:
                                          type: child
                                          child:
                                            node:
                                              id: status-trust
                                              component: "@dash-bored/status"
                                              props:
                                                label: Host capabilities
                                                state: warning
                                                detail: File reads and commands require an explicit project trust decision.
                  second:
                    type: split
                    axis: vertical
                    ratio: 0.5
                    first:
                      type: child
                      child:
                        node:
                          id: git-branches-card
                          component: "@dash-bored/card"
                          props:
                            title: Git branches
                            description: Commits unique to each local branch, plus upstream tracking.
                          children:
                            type: tiled
                            layout:
                              type: child
                              child:
                                node:
                                  id: git-branches
                                  component: ./components/git-branches
                                  props:
                                    cwd: .
                                    baseBranch: main
                    second:
                      type: split
                      axis: vertical
                      ratio: 0.5
                      first:
                        type: child
                        child:
                          node:
                            id: yaml-todo-card
                            component: "@dash-bored/card"
                            props:
                              title: YAML todo list
                              description: A small stateful component whose items live with its configuration.
                            children:
                              type: tiled
                              layout:
                                type: child
                                child:
                                  node:
                                    id: yaml-todo
                                    component: "@dash-bored/todo-list"
                                    props:
                                      todos:
                                        - description: Add a better agent interface with user feedback and control
                                          done: true
                                          tags:
                                            - improvement
                                        - description: Keyboard shortcut editor, in settings, tied in with command pallet actions
                                          done: false
                                          tags:
                                            - feature
                                        - description: Theme and styling as component?
                                          done: false
                                          tags:
                                            - feature
                                        - description: Individually collapsable components in sidebar tree view
                                          done: false
                                          tags:
                                            - feature
                                        - description: Components moveable from tree view
                                          done: false
                                          tags:
                                            - feature
                                        - description: Pick up and hover with component to drill down on target. I.e. Hover over Card to drop component into card.
                                          done: false
                                          tags:
                                            - Improvement
                                        - description: Add conditional component, hide “install cli/skill" components in default dashboard if already done
                                          done: true
                                          tags:
                                            - feature
                                            - component
                      second:
                        type: child
                        child:
                          node:
                            id: dashboard-lifecycle-card
                            component: "@dash-bored/card"
                            props:
                              title: Dashboard lifecycle
                              description: Safe registry removal and project-file cleanup.
                            children:
                              type: tiled
                              layout:
                                type: child
                                child:
                                  node:
                                    id: dashboard-lifecycle
                                    component: "@dash-bored/markdown"
                                    props:
                                      content: |
                                        ### Dashboard lifecycle

                                        The expanded sidebar exposes a keyboard-accessible trash action.
                                        Removal only forgets the dashboard by default. Before optional
                                        cleanup, dash-bored previews direct and transitive config links;
                                        incomplete analysis keeps file removal disabled.

                                        If selected, only this project's app-owned `dash-bored/` directory
                                        moves to the OS Trash. Source project files are never targeted.
      - metadata:
          label: Development
        node:
          id: development
          component: "@dash-bored/group"
          children:
            type: tiled
            layout:
              type: split
              axis: vertical
              ratio: 0.5
              first:
                type: child
                child:
                  node:
                    id: development-intro
                    component: "@dash-bored/markdown"
                    props:
                      content: |
                        ## Development loop

                        Start the desktop development environment when you need live renderer
                        and main-process updates. Run QA before handing changes off. Commands
                        never run automatically; each is an explicit, trusted action. For UI changes, run **ui:fixture** and inspect the normal and narrow renderer before the separate native desktop check.
              second:
                type: split
                axis: vertical
                ratio: 0.5
                first:
                  type: child
                  child:
                    node:
                      id: development-layout
                      component: "@dash-bored/group"
                      children:
                        type: tiled
                        layout:
                          type: child
                          child:
                            node:
                              id: development-controls
                              component: "@dash-bored/group"
                              children:
                                type: tiled
                                layout:
                                  type: split
                                  axis: vertical
                                  ratio: 0.5
                                  first:
                                    type: child
                                    child:
                                      node:
                                        id: start-development
                                        component: "@dash-bored/command"
                                        props:
                                          label: Start development environment
                                          command: bun run dev
                                          cwd: .
                                  second:
                                    type: split
                                    axis: vertical
                                    ratio: 0.5
                                    first:
                                      type: child
                                      child:
                                        node:
                                          id: docker-connectivity
                                          component: "@dash-bored/command"
                                          props:
                                            label: Check Docker connectivity
                                            command: docker version --format 'Docker {{.Client.Version}} → server {{.Server.Version}} ({{.Server.Os}}/{{.Server.Arch}})'
                                            cwd: .
                                    second:
                                      type: split
                                      axis: vertical
                                      ratio: 0.5
                                      first:
                                        type: child
                                        child:
                                          node:
                                            id: run-qa
                                            component: "@dash-bored/command"
                                            props:
                                              label: Run full QA
                                              command: bun run qa
                                              cwd: .
                                      second:
                                        type: child
                                        child:
                                          node:
                                            id: validate-dashboard
                                            component: "@dash-bored/command"
                                            props:
                                              label: Validate dashboard configuration
                                              command: bun run dash-bored -- validate .
                                              cwd: .
                second:
                  type: split
                  axis: vertical
                  ratio: 0.5
                  first:
                    type: child
                    child:
                      node:
                        id: local-preview-card
                        component: "@dash-bored/card"
                        props:
                          title: Renderer preview
                          description: Available after the development environment has started.
                        children:
                          type: tiled
                          layout:
                            type: child
                            child:
                              node:
                                id: renderer-preview
                                component: "@dash-bored/webview"
                                props:
                                  url: http://localhost:5173
                  second:
                    type: child
                    child:
                      node:
                        id: package-scripts-card
                        component: "@dash-bored/card"
                        props:
                          title: Package scripts
                          description: Every package.json script is available as a button and command-palette action.
                        children:
                          type: tiled
                          layout:
                            type: child
                            child:
                              node:
                                id: package-scripts
                                component: ./components/package-scripts
                                props:
                                  packageFile: package.json
      - metadata:
          label: Release
        node:
          id: release
          component: "@dash-bored/group"
          children:
            type: tiled
            layout:
              type: split
              axis: vertical
              ratio: 0.5
              first:
                type: child
                child:
                  node:
                    id: release-intro
                    component: "@dash-bored/markdown"
                    props:
                      content: |
                        ## Unsigned macOS prerelease

                        Releases currently target Apple Silicon on macOS 14 or newer.
                        Run the checks in order before pushing a tag that exactly matches
                        `v<package.json version>`. GitHub Actions repeats these checks and
                        creates a draft prerelease for explicit publication.
              second:
                type: split
                axis: vertical
                ratio: 0.5
                first:
                  type: child
                  child:
                    node:
                      id: release-layout
                      component: "@dash-bored/group"
                      children:
                        type: tiled
                        layout:
                          type: child
                          child:
                            node:
                              id: release-controls
                              component: "@dash-bored/group"
                              children:
                                type: tiled
                                layout:
                                  type: split
                                  axis: vertical
                                  ratio: 0.5
                                  first:
                                    type: child
                                    child:
                                      node:
                                        id: run-release-qa
                                        component: "@dash-bored/command"
                                        props:
                                          label: Run release QA
                                          command: bun run qa && bun run dash-bored -- validate .
                                          cwd: .
                                  second:
                                    type: split
                                    axis: vertical
                                    ratio: 0.5
                                    first:
                                      type: child
                                      child:
                                        node:
                                          id: build-macos-release
                                          component: "@dash-bored/command"
                                          props:
                                            label: Build clean macOS prerelease
                                            command: bun run build:release
                                            cwd: .
                                    second:
                                      type: child
                                      child:
                                        node:
                                          id: prepare-macos-release
                                          component: "@dash-bored/command"
                                          props:
                                            label: Verify and stage release assets
                                            command: bun run release:prepare
                                            cwd: .
                second:
                  type: child
                  child:
                    node:
                      id: release-workflow-card
                      component: "@dash-bored/card"
                      props:
                        title: GitHub release workflow
                        description: The tag-triggered source of truth for draft prerelease publication.
                      children:
                        type: tiled
                        layout:
                          type: child
                          child:
                            node:
                              id: release-workflow-file
                              component: "@dash-bored/file"
                              props:
                                path: .github/workflows/release.yml
      - metadata:
          label: Documentation
        node:
          id: documentation
          component: "@dash-bored/tabs"
          children:
            type: managed
            items:
              - metadata:
                  label: README
                node:
                  id: readme-file
                  component: "@dash-bored/file"
                  props:
                    path: README.md
              - metadata:
                  label: Product vision
                node:
                  id: idea-file
                  component: "@dash-bored/file"
                  props:
                    path: IDEA.md
              - metadata:
                  label: Architecture
                node:
                  id: architecture-file
                  component: "@dash-bored/file"
                  props:
                    path: ARCHITECTURE.md
      - metadata:
          label: Agent setup
        node:
          id: agent-setup
          component: "@dash-bored/card"
          props:
            title: Configure with an agent
            description: Exercise the same self-contained setup flow generated for new projects.
          children:
            type: tiled
            layout:
              type: split
              axis: vertical
              ratio: 0.5
              first:
                type: child
                child:
                  node:
                    id: agent-setup-guide
                    component: "@dash-bored/markdown"
                    props:
                      content: |
                        Choose the CLI coding agent below, install the version-matched
                        dash-bored skill globally or just for this repository, then ask the
                        agent to inspect this repository and improve its development cockpit.
                        The app already exposes its bundled CLI to these commands.
              second:
                type: split
                axis: vertical
                ratio: 0.5
                first:
                  type: child
                  child:
                    node:
                      id: agent-environment
                      component: "@dash-bored/env"
                      props:
                        path: dash-bored/.env
                second:
                  type: split
                  axis: vertical
                  ratio: 0.5
                  first:
                    type: child
                    child:
                      node:
                        id: show-install-cli-link
                        component: "@dash-bored/conditional"
                        props:
                          command: test -L "$HOME/.local/bin/dash-bored" && "$HOME/.local/bin/dash-bored" --version >/dev/null 2>&1
                          invert: true
                          pollIntervalMs: 2000
                        children:
                          type: tiled
                          layout:
                            type: child
                            child:
                              node:
                                id: install-cli-link
                                component: "@dash-bored/command"
                                props:
                                  label: Install dash-bored CLI in ~/.local/bin
                                  command: '"${DASH_BORED_BUNDLED_CLI:-dash-bored}" install-cli'
                                  cwd: .
                  second:
                    type: split
                    axis: vertical
                    ratio: 0.5
                    first:
                      type: child
                      child:
                        node:
                          id: show-install-agent-skill-global
                          component: "@dash-bored/conditional"
                          props:
                            command: test -f "$HOME/.agents/skills/dash-bored/SKILL.md"
                            invert: true
                            pollIntervalMs: 2000
                          children:
                            type: tiled
                            layout:
                              type: child
                              child:
                                node:
                                  id: install-agent-skill-global
                                  component: "@dash-bored/command"
                                  props:
                                    label: Install dash-bored skill globally
                                    command: '"${DASH_BORED_BUNDLED_CLI:-dash-bored}" install-skill --global'
                                    cwd: .
                    second:
                      type: split
                      axis: vertical
                      ratio: 0.5
                      first:
                        type: child
                        child:
                          node:
                            id: show-install-agent-skill
                            component: "@dash-bored/conditional"
                            props:
                              command: test -f ".agents/skills/dash-bored/SKILL.md"
                              invert: true
                              pollIntervalMs: 2000
                            children:
                              type: tiled
                              layout:
                                type: child
                                child:
                                  node:
                                    id: install-agent-skill
                                    component: "@dash-bored/command"
                                    props:
                                      label: Install portable dash-bored skill for this project
                                      command: '"${DASH_BORED_BUNDLED_CLI:-dash-bored}" install-skill .'
                                      cwd: .
                      second:
                        type: child
                        child:
                          node:
                            id: configure-with-agent
                            component: "@dash-bored/command"
                            props:
                              label: Improve this dashboard with an agent
                              command: dash-bored agent "${DASH_BORED_AGENT:-codex exec}"
                              cwd: .
                              env:
                                DASH_BORED_AGENT_PROMPT: Use the installed dash-bored skill. Inspect this repository and its current dash-bored dashboard, then improve the development cockpit where that is genuinely useful. Preserve unrelated changes, validate the result, and summarize the workflows and permissions you changed.
      - metadata:
          label: Dogfood
        node:
          id: dogfood-dashboard
          component: ./dogfood
