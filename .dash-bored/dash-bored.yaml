schemaVersion: 3
name: Dash Bored
icon: ../assets/icon.svg
theme: builtin:default
themeMode: system
root:
  id: project-cockpit
  component: "@dash-bored/group"
  children:
    axis: vertical
    first:
      node:
        id: project-section-tabs
        component: "@dash-bored/button"
        persistOnFocus: true
        props:
          variant: tabs
          items:
            - name: Overview
              action: select:project-sections/cockpit
            - name: Work
              action: select:project-sections/project-work
            - name: Changes
              action: select:project-sections/changes
            - name: Develop
              action: select:project-sections/development
            - name: Roadmap
              action: select:project-sections/roadmap
            - name: Release
              action: select:project-sections/release
            - name: Agent
              action: select:project-sections/agent-setup
            - name: Docs
              action: select:project-sections/documentation
            - name: Lab
              action: select:project-sections/dogfood-dashboard
            - name: Focus
              action: select:project-sections/project-focus-timer
            - name: Themes
              action: select:project-sections/theme-reference
    second:
      node:
        id: project-sections
        component: "@dash-bored/selection"
        props:
          defaultChild: cockpit
        children:
          - metadata:
              label: Overview
            node:
              id: cockpit
              component: "@dash-bored/group"
              children:
                axis: vertical
                first:
                  axis: horizontal
                  first:
                    axis: horizontal
                    first:
                      node:
                        id: workspace-status
                        component: "@dash-bored/status"
                        props:
                          label: Working tree
                          source:
                            shell: bun run .dash-bored/scripts/workspace-status.ts
                            cwd: .
                            every: 10000
                    second:
                      node:
                        id: dashboard-health
                        component: "@dash-bored/status"
                        props:
                          label: Dashboard config
                          source:
                            shell: bun run .dash-bored/scripts/dashboard-health.ts
                            cwd: .
                            every: 30000
                            timeoutMs: 20000
                  second:
                    axis: horizontal
                    first:
                      node:
                        id: qa-status
                        component: "@dash-bored/status"
                        props:
                          label: Last QA run
                          source:
                            process: run-qa
                    second:
                      node:
                        id: todo-status
                        component: "@dash-bored/status"
                        props:
                          label: Backlog
                          source:
                            shell: bun run .dash-bored/scripts/todo-stats.ts status
                            cwd: .
                            every: 15000
                second:
                  axis: vertical
                  first:
                    node:
                      id: cockpit-actions
                      component: "@dash-bored/button"
                      persistOnFocus: true
                      props:
                        items:
                          - name: Run QA
                            action: process:run-qa
                          - name: Validate
                            action: process:validate-dashboard
                          - name: Review changes
                            action: select:project-sections/changes
                          - name: Open backlog
                            action: reveal:yaml-todo
                  second:
                    axis: horizontal
                    first:
                      node:
                        id: project-pulse
                        component: "@dash-bored/group"
                        children:
                          node:
                            id: commit-pulse
                            component: "@dash-bored/status"
                            props:
                              label: Commits · last 14 days
                              source:
                                shell: bun run .dash-bored/scripts/git-log.ts pulse
                                cwd: .
                                every: 60000
                        props:
                          title: Project activity
                          description: Recent movement across all branches. Changes holds the daily chart and history.
                    second:
                      node:
                        id: cockpit-attention
                        component: "@dash-bored/list"
                        props:
                          title: Open work · bugs first
                          filterByTags: false
                          sort: source-order
                          source:
                            shell: bun run .dash-bored/scripts/todo-stats.ts attention
                            every: 15000
                          itemActions:
                            - name: Show in backlog
                              action:
                                run: reveal:yaml-todo
                                with:
                                  item: ${item.id}
              props:
                title: Project at a glance
                description: Health, recent activity, and open work. Choose a section for detail.
          - metadata:
              label: Work
            node:
              id: project-work
              component: "@dash-bored/group"
              props:
                title: Project work
                description: The full editable backlog and checks. Overview shows the first five open items, with bugs first.
              children:
                axis: vertical
                first:
                  node:
                    id: work-actions
                    component: "@dash-bored/button"
                    persistOnFocus: true
                    props:
                      variant: buttons
                      items:
                        - name: Run QA
                          action: process:run-qa
                        - name: Validate dashboard
                          action: process:validate-dashboard
                        - name: Start dev environment
                          action: process:start-development
                        - name: Review changes
                          action: select:project-sections/changes
                        - name: Package scripts
                          action: reveal:package-script-catalog
                        - name: Triage todos with agent
                          action:
                            run: agent:prompt
                            with:
                              prompt: Review the open todos in node yaml-todo of .dash-bored/dash-bored.yaml. Recommend one scoped next action with rationale; do not edit files or change todo completion state.
                second:
                  axis: vertical
                  first:
                    node:
                      id: yaml-todo
                      component: "@dash-bored/list"
                      props:
                        title: Project backlog
                        itemActions:
                          - name: Implement with agent
                            action:
                              run: agent:prompt
                              with:
                                template: implement-todo
                                prompt: ${item.description}
                                vars:
                                  id: ${item.id}
                        todos:
                          - id: todo-001
                            description: Adopt the shared bounded source contract in status, chart, list, and Markdown views, then migrate the legacy live-chart polling path.
                            done: true
                            tags:
                              - atom-roadmap
                          - id: todo-002
                            description: Expose tab selection as palette actions so agents can switch tabs without focusing a node (tabs keep selection in local component state today).
                            done: true
                            tags:
                              - agent-tools
                          - id: todo-003
                            description: Implement parameterized declared actions and agent:prompt as planned in atoms roadmap WP3.
                            done: true
                            tags:
                              - atoms
                          - id: todo-004
                            description: Add a palette action that clears focus and shows the whole dashboard, so agent screenshots can restore the unfocused view explicitly.
                            done: false
                            tags:
                              - agent-tools
                          - id: todo-005
                            description: Crop agent screenshots to a node's bounds (app screenshot --node) instead of only capturing the whole window.
                            done: true
                            tags:
                              - agent-tools
                          - id: todo-032
                            description: Keep app actions listings compact; choice-heavy actions such as theme:set-default embed every option (about 26 KB for one entry), so list choices only on request.
                            done: true
                            tags:
                              - agent-tools
                          - id: todo-agent-read-structured
                            description: "Add app read --json for list and status views: return the view's items (id, title, tags, done, state) instead of flattened innerText with button labels, so agents can count and filter without parsing the YAML."
                            done: false
                            tags:
                              - agent-tools
                          - id: todo-agent-tab-attention
                            description: Add an agent summary of a tab (app read <selection-child> --summary) listing every nested status, list, and command panel with its state, so asking whether anything on a tab needs attention is one call.
                            done: false
                            tags:
                              - agent-tools
                          - id: todo-command-read-only-hint
                            description: Let command nodes declare whether they are read-only checks (validate, status) or side-effecting (build, release), and expose it in app actions, so agents know what they may run without asking.
                            done: false
                            tags:
                              - agent-tools
                          - id: todo-007
                            description: "Improve renderer test startup failures: report Vite stderr and early process exit instead of only a fixture timeout."
                            done: true
                            tags:
                              - tooling
                          - id: todo-008
                            description: Add a better agent interface with user feedback and control
                            done: true
                            tags:
                              - improvement
                          - id: todo-009
                            description: Keyboard shortcut editor, in settings, tied in with command pallet actions
                            done: true
                            tags:
                              - feature
                          - id: todo-010
                            description: Theme and styling as component?
                            done: true
                            tags:
                              - feature
                          - id: todo-011
                            description: Individually collapsable components in sidebar tree view
                            done: true
                            tags:
                              - feature
                          - id: todo-012
                            description: Components moveable from tree view
                            done: true
                            tags:
                              - feature
                          - id: todo-013
                            description: "Pick up and hover with component to drill down on target. ex: Hover over Card to drop component into card."
                            done: true
                            tags:
                              - Improvement
                          - id: todo-014
                            description: Add conditional component, hide “install cli/skill" components in default dashboard if already done
                            done: true
                            tags:
                              - feature
                              - component
                          - id: todo-015
                            description: unify agent work and component library look
                            done: true
                            tags:
                              - improvement
                          - id: todo-016
                            description: Enable beta/stable release channels, make stable the default for new installations, and define explicit transitions for existing canary users without silently switching channels.
                            done: false
                            tags:
                              - distribution
                              - updates
                          - id: todo-017
                            description: Verified isolated unsigned macOS 99.0.1-to-99.0.2 native replacement, relaunch and matching CLI; fixed PAX archive rejection with USTAR and retained the verified DMG fallback.
                            done: true
                            tags:
                              - verification
                              - updates
                          - id: todo-018
                            description: Verify downloaded-DMG Gatekeeper Open Anyway approval for the first updater-capable release; never bypass normal macOS security approval.
                            done: true
                            tags:
                              - verification
                              - release
                          - id: todo-019
                            description: Provide tools (wrap cli?) with skill so that agent actions and progress can be cleanly and in a nice way shown to the user
                            done: true
                            tags:
                              - feature
                          - id: todo-020
                            description: Agent work modal not showing diff
                            done: true
                            tags:
                              - bug
                          - id: todo-021
                            description: Remove Agent work modal redundant "Recent agent output” dropdown
                            done: true
                            tags:
                              - chore
                          - id: todo-022
                            description: Add “Save dashboard” button to alert that is shown when navigating away from dashboard with unsaved changes
                            done: true
                            tags:
                              - improvement
                          - id: todo-024
                            description: "Drag targeting: let edge distance escalate to ancestor boundaries so a drop can tile beside a whole split pane or at the dashboard edge, not only beside the deepest hovered node's siblings."
                            done: false
                            tags:
                              - improvement
                          - id: todo-025
                            description: Auto-scroll scroll containers when a composition drag nears their edge.
                            done: false
                            tags:
                              - improvement
                          - id: todo-026
                            description: Retire the native HTML5 drag handlers in ComponentFrame and keep composition drags pointer-only.
                            done: true
                            tags:
                              - chore
                          - id: todo-027
                            description: Replace the remaining App.tsx render-time latest-ref writes (snapshotRef, editSessionRef, processesRef, agentControlStateRef) with effect-synced refs or store reads. The L1 ActionStore already removed actionsByIdRef and runningActionIdsRef (react-doctor no-ref-current-in-render).
                            done: true
                            tags:
                              - chore
                          - id: todo-028
                            description: Before unifying the dashboard tree and editor, verify native drag, move up/down, and Save/Cancel in the dash-bored dev app. Computer Use was not approved to use dash-bored-dev, so the L4 native UI gate remains open.
                            done: false
                            tags:
                              - chore
                          - id: todo-029
                            description: "Define key-based list filter reset semantics before replacing filter effects: retain a still-valid selected tag, decide behavior when the source or tag set changes, and preserve todo editing and focus state."
                            done: false
                            tags:
                              - chore
                          - id: todo-030
                            description: "Completed the milestone-one resumption: reviewed and committed S4, S12, and S14; completed S7 and S11. Continue with stores, host, and builtins in planned order."
                            done: true
                            tags:
                              - chore
                          - id: todo-031
                            description: "Finish the inherent-complexity refactor (L3 App.tsx split landed on refactor/l3-app-split): L6 push-only host state, merged RPC commands, thin main/index.ts; rest of L7 (tree-links and tree-validate split, src/migrations/, one PackageStore); L4 one tree and one editor (gated on todo-028); L5 builtins match the atom set (card and conditional retirement waits for schema v4). Plan: https://claude.ai/code/artifact/b334bffd-a35b-4e9e-8e37-b4c33935c15a"
                            done: false
                            tags:
                              - chore
                          - id: todo-agent-run-idle-live
                            description: Live-verify the app run idle wait in the desktop app (time component:workspace-status:refresh, screenshot right after); it was not verified live where it was added because Hutch prepare was blocked.
                            done: true
                            tags:
                              - chore
                          - id: todo-atoms-schema-migration
                            description: "Complete atoms WP9: add source-bound edge visibility and ship the schema-v4 migration for retired builtins and positional references."
                            done: false
                            tags:
                              - atoms
                          - id: todo-command-quick-action-exit
                            description: A @dash-bored/command keeps its interactive shell open after the quick action finishes, so status tiles with source.process (such as qa-status) report running instead of the last exit code, and a command's run item action stays disabled after its first use until Stop. Track quick-action completion separately from the shell, or offer a non-interactive run mode; then drop the caveat from the skill's sources reference.
                            done: true
                            tags:
                              - atoms
                              - bug
                          - id: todo-command-run-fixture-coverage
                            description: The renderer UI fixture host (src/renderer/lib/ui-harness-host.ts) does not model a command's per-run `run` record, so test:renderer-ui cannot prove the Run, exit badge, Run-again loop, a process-bound status tile turning healthy or error, or an item action re-running without Close terminal. Model runs in the fixture and add that interaction test.
                            done: false
                            tags:
                              - atoms
                              - tests
                          - id: todo-agent-tool-source-check
                            description: Add an agent-tool check that runs each shell and file source once and reports view-shape mismatches (status, list, chart) with the node path. validate never executes sources, so agents only discover a wrong shape in the app.
                            done: false
                            tags:
                              - agent-tool
                              - skill
                          - id: todo-validate-text-diagnostics
                            description: Include each diagnostic's path in validate's text output, and give ${item.*} inside command text a specific message instead of the schema's 'must NOT be valid'.
                            done: false
                            tags:
                              - agent-tool
                          - id: todo-catalog-retiring-builtins
                            description: Mark retiring builtins (card, tabs, todo-list, live-chart, conditional, setup-agent, focus-timer) in inspect --summary and the generated builtins reference so agents stop picking them from the catalog; the skill currently lists them by hand.
                            done: false
                            tags:
                              - agent-tool
                              - skill
                          - id: todo-creation-prompt-sources
                            description: "Align the structural editor's natural-language creation prompt with IDEA.md: it tells agents to build a project-local component, while IDEA prefers a source script feeding an existing view."
                            done: true
                            tags:
                              - agent
                              - skill
                          - id: todo-skill-trigger-evals
                            description: Run trigger evals for the skill description with near-miss queries (starting services, deploying, app dashboards in user code); past sessions showed it firing on unrelated ops tasks in projects with .dash-bored/.
                            done: false
                            tags:
                              - skill
                          - id: todo-eval-skill-suite
                            description: "Grow the WIP skill A/B eval in scripts/eval/skill/ into a repeatable suite: scripted headless agent runs, isolation and the compiled tool (likely inside release-qa's Docker harness), repeats with token/time capture, and JSON deltas. The Todo list in scripts/eval/README.md has the steps."
                            done: false
                            tags:
                              - skill
                              - eval
                          - id: todo-starter-prompt-sources
                            description: "Resolve the starter setup prompt's conflict with IDEA.md: starterAgentPrompt says to build a project-local component 'by default' when nothing in the catalog fits and never mentions source scripts, while IDEA prefers a source script feeding an existing view. The prompt was deliberately reviewed, so decide before changing it."
                            done: false
                            tags:
                              - agent
                              - skill
                          - id: todo-glance-changes-since-visit
                            description: Persist "changed since you last looked" per dashboard across remounts and reloads (a bounded last-seen snapshot per status/list node), so tab switches and restarts keep the cue; today status and list change markers are per-mount and in memory.
                            done: false
                            tags:
                              - renderer
                              - visual
                          - id: todo-glance-status-history
                            description: Offer an opt-in status history strip built from retained recent observations (bounded, reduced-motion aware) for sources that cannot emit their own trend, such as the working-tree status.
                            done: false
                            tags:
                              - renderer
                              - visual
                          - id: todo-glance-chart-part-of-whole
                            description: Add a chart variant for part-of-whole history (stacked bars, e.g. QA pass/fail per run) and a real QA run-history source to feed it on the Overview.
                            done: false
                            tags:
                              - renderer
                              - visual
                              - qa
                          - id: todo-drag-handle-button-overlap
                            description: The hover drag handle (top 5-22 px, centered) reaches the vertical centre of a single 44 px action-button frame, so a click exactly at the button's centre can land on the handle. Move or shrink the handle for short frames; the renderer UI tests click below it for now.
                            done: false
                            tags:
                              - bug
                              - renderer
                          - id: todo-starter-trust-button-reason
                            description: The starter's Trust project button targets project:trust, which disappears once trusted, so the button shows the generic reason 'This action is not available in the current view.' Give state-dependent app actions a stable disabled entry (for example 'This project is already trusted') instead of vanishing.
                            done: false
                            tags:
                              - renderer
                              - onboarding
                          - id: todo-command-narrow-title
                            description: In a narrow column the command component's title wraps one word per line and slides under its Open terminal and run buttons (seen in the starter's skill step). Let the title take the full row above the controls when space is short.
                            done: false
                            tags:
                              - bug
                              - renderer
                          - id: todo-screenshot-focus-timeout
                            description: "`app screenshot --focus <id>` intermittently fails with 'RPC request timed out', reliably so when the node is already focused; the same capture without --focus succeeds."
                            done: false
                            tags:
                              - bug
                              - agent-tools
                          - id: todo-starter-native-visual-check
                            description: Capture the redesigned starter (Get started steps plus component tour) in the native app, untrusted and trusted, at desktop and narrow widths. The app screenshot RPC timed out in the implementing session, so only action wiring and source output were verified.
                            done: false
                            tags:
                              - onboarding
                              - visual
                              - qa
                          - id: todo-prompt-templates-builtin-flows
                            description: Render Build with agent, Fix with agent, setup, and migration prompts from overridable built-in templates (component-build, diagnostics-fix, setup) so a bundle can customize every agent entry point, not only project and dashboard.
                            done: false
                            tags:
                              - agent-tools
                          - id: todo-prompt-templates-ask-agent
                            description: Add an "Ask agent…" panel-menu entry beside Change with agent that opens the composer with the project template and the panel as context.
                            done: false
                            tags:
                              - agent-tools
                              - renderer
                          - id: todo-prompt-templates-discovery
                            description: "Make prompt templates discoverable: list them in `inspect --summary` for agents and let the command palette's Send prompt to agent pick a template."
                            done: false
                            tags:
                              - agent-tools
                          - id: todo-prompt-templates-whole-item
                            description: "Let an item action pass the whole list item as prompt context (for example `vars: ${item}`) instead of naming each field."
                            done: false
                            tags:
                              - agent-tools
                  second:
                    node:
                      id: checks
                      component: "@dash-bored/group"
                      props:
                        title: Checks
                        description: The status tiles above observe these supervised processes.
                      children:
                        axis: vertical
                        first:
                          node:
                            id: run-qa
                            component: "@dash-bored/command"
                            props:
                              label: Run QA (reuse prepared Hutch)
                              command: bun run qa:fast
                              cwd: .
                        second:
                          axis: vertical
                          first:
                            node:
                              id: validate-dashboard
                              component: "@dash-bored/command"
                              props:
                                label: Validate dashboard configuration
                                command: bun run dash-bored -- validate .
                                cwd: .
                          second:
                            axis: vertical
                            first:
                              node:
                                id: verify-agent-diffs
                                component: "@dash-bored/command"
                                props:
                                  label: Verify Agent work diffs
                                  command: bun test tests/main/dashboard-agent-diff.test.ts
                                  cwd: .
                            second:
                              node:
                                id: verify-agent-terminal-ui
                                component: "@dash-bored/command"
                                props:
                                  label: Verify Agent work terminal layout
                                  command: bun test tests/renderer/ui-interaction.test.ts --test-name-pattern 'long agent prompts|modal scroll boundaries|agent terminals keep keyboard focus'
                                  cwd: .
          - metadata:
              label: Changes
            node:
              id: changes
              component: "@dash-bored/group"
              children:
                axis: vertical
                first:
                  node:
                    id: changes-actions
                    component: "@dash-bored/button"
                    props:
                      variant: buttons
                      items:
                        - name: Refresh working tree
                          action: component:git-changes:refresh
                        - name: Refresh history
                          action: component:recent-commits:refresh
                        - name: Draft commit message with agent
                          action:
                            run: agent:prompt
                            with:
                              prompt: Draft a conventional commit message for the currently staged changes in this repository (git diff --cached). Show the message only; do not stage, commit, or edit files.
                        - name: Review branch with agent
                          action:
                            run: agent:prompt
                            with:
                              prompt: Review the commits on the current branch that are not on main. Summarize the change set and list correctness risks; do not edit files.
                second:
                  axis: vertical
                  first:
                    axis: horizontal
                    ratio: 0.45
                    first:
                      node:
                        id: git-changes
                        component: "@dash-bored/list"
                        props:
                          title: Working tree
                          sort: source-order
                          source:
                            shell: bun run .dash-bored/scripts/git-changes.ts
                            cwd: .
                            every: 10000
                          itemActions:
                            - name: Diff
                              action:
                                run: component:git-diff-runner:run
                                with:
                                  path: ${item.path}
                            - name: Review with agent
                              action:
                                run: agent:prompt
                                with:
                                  prompt: ${item.prompt}
                    second:
                      node:
                        id: git-diff-runner
                        component: "@dash-bored/command"
                        props:
                          label: Diff selected file
                          command: if git ls-files --error-unmatch -- "$DASH_ITEM_PATH" >/dev/null 2>&1; then git --no-pager diff --color=always HEAD -- "$DASH_ITEM_PATH"; else git --no-pager diff --color=always --no-index -- /dev/null "$DASH_ITEM_PATH" || test $? -eq 1; fi
                          cwd: .
                  second:
                    axis: vertical
                    first:
                      node:
                        id: git-activity
                        component: "@dash-bored/chart"
                        props:
                          title: Commits · last 14 days
                          type: bar
                          source:
                            shell: bun run .dash-bored/scripts/git-log.ts activity
                            cwd: .
                            every: 60000
                    second:
                      axis: vertical
                      first:
                        axis: horizontal
                        ratio: 0.45
                        first:
                          node:
                            id: recent-commits
                            component: "@dash-bored/list"
                            props:
                              title: Recent commits
                              sort: source-order
                              source:
                                shell: bun run .dash-bored/scripts/git-log.ts list
                                cwd: .
                                every: 30000
                              itemActions:
                                - name: Show
                                  action:
                                    run: component:git-show-runner:run
                                    with:
                                      sha: ${item.sha}
                        second:
                          node:
                            id: git-show-runner
                            component: "@dash-bored/command"
                            props:
                              label: Show selected commit
                              command: git --no-pager show --stat --patch --color=always "$DASH_ITEM_SHA"
                              cwd: .
                      second:
                        axis: horizontal
                        ratio: 0.45
                        first:
                          node:
                            id: git-branches
                            component: "@dash-bored/list"
                            props:
                              title: Branches
                              source:
                                shell: bun run .dash-bored/scripts/git-branches.ts
                                cwd: .
                                every: 30000
                                env:
                                  DASH_BORED_BASE_BRANCH: main
                              itemActions:
                                - name: Log
                                  action:
                                    run: component:git-branch-log:run
                                    with:
                                      name: ${item.name}
                        second:
                          node:
                            id: git-branch-log
                            component: "@dash-bored/command"
                            props:
                              label: Log selected branch against main
                              command: git --no-pager log --color=always --graph --oneline --decorate -30 "$DASH_ITEM_NAME" --not main --
                              cwd: .
          - metadata:
              label: Develop
            node:
              id: development
              component: "@dash-bored/group"
              children:
                axis: vertical
                first:
                  axis: vertical
                  first:
                    node:
                      id: development-intro
                      component: "@dash-bored/markdown"
                      props:
                        content: |
                          **Development loop.** Start the desktop environment for live renderer and main-process
                          updates; prefer the `:fast` checks while a watcher holds the Electrobun lock. For UI
                          changes, start **UI fixture** and inspect it below at normal and narrow widths before the
                          native desktop check.
                  second:
                    node:
                      id: palette-workflow
                      component: "@dash-bored/markdown"
                      props:
                        title: Run several palette actions
                        content: |
                          Open Commands with **⌘K**, search for a command, and use **⌘Enter** (or **⌘click**)
                          to run it while keeping the palette open. Try **Validate dashboard** followed by
                          **Typecheck (fast)**. Regular Enter closes the palette.

                          Search clears after each keep-open invocation by default. In **Settings → General**,
                          turn off **Clear search when keeping the palette open** to retain it. App controls
                          remain available; dashboard actions belong to the currently selected dashboard.
                          Choose **Switch dashboard** in the palette to open another registered dashboard.

                          With Commands closed, hold **⌘** to see sidebar number hints and press **1–9**
                          to switch dashboards. Drag a dashboard icon above or below another row to save
                          a new order; the number shortcuts follow it. Try switching back with **⌘1**.
                          Click the active dashboard again, or press its **⌘number** again, to toggle
                          sidebar expansion. From Settings, it returns to the dashboard instead.
                second:
                  axis: vertical
                  first:
                    node:
                      id: development-controls
                      component: "@dash-bored/group"
                      props:
                        title: Dev commands
                      children:
                        axis: horizontal
                        ratio: 0.3333
                        first:
                          axis: vertical
                          first:
                            node:
                              id: start-development
                              component: "@dash-bored/command"
                              props:
                                label: Start development environment
                                command: bun run dev
                                cwd: .
                          second:
                            axis: vertical
                            first:
                              node:
                                id: stop-development
                                component: "@dash-bored/command"
                                props:
                                  label: Stop this checkout's dev build
                                  command: bun run dev:stop
                                  cwd: .
                            second:
                              node:
                                id: ui-fixture
                                component: "@dash-bored/command"
                                props:
                                  label: Serve UI fixture (renderer only)
                                  command: bun run ui:fixture
                                  cwd: .
                        second:
                          axis: horizontal
                          first:
                            axis: vertical
                            first:
                              node:
                                id: typecheck-fast
                                component: "@dash-bored/command"
                                props:
                                  label: Typecheck (fast)
                                  command: bun run typecheck:fast
                                  cwd: .
                            second:
                              node:
                                id: build-renderer-fast
                                component: "@dash-bored/command"
                                props:
                                  label: Build renderer (fast)
                                  command: bun run build:renderer:fast
                                  cwd: .
                          second:
                            axis: vertical
                            first:
                              node:
                                id: test-suite
                                component: "@dash-bored/command"
                                props:
                                  label: Full test suite
                                  command: bun run test
                                  cwd: .
                            second:
                              node:
                                id: renderer-ui-test
                                component: "@dash-bored/command"
                                props:
                                  label: Renderer interaction suite
                                  command: bun run test:renderer-ui
                                  cwd: .
                  second:
                    axis: vertical
                    first:
                      axis: horizontal
                      ratio: 0.5
                      first:
                        node:
                          id: package-scripts
                          component: "@dash-bored/group"
                          props:
                            title: Package scripts
                            description: Run passes the script name and runner as DASH_ITEM_* values.
                          children:
                            axis: vertical
                            first:
                              node:
                                id: package-script-catalog
                                component: "@dash-bored/list"
                                props:
                                  title: Package scripts
                                  source:
                                    shell: bun run .dash-bored/scripts/package-scripts.ts
                                    cwd: .
                                    every: 30000
                                  sort: source-order
                                  itemActions:
                                    - name: Run
                                      action:
                                        run: component:package-script-runner:run
                                        with:
                                          name: ${item.name}
                                          runner: ${item.runner}
                            second:
                              node:
                                id: package-script-runner
                                component: "@dash-bored/command"
                                props:
                                  label: Run selected package script
                                  command: '"$DASH_ITEM_RUNNER" run "$DASH_ITEM_NAME"'
                                  cwd: .
                      second:
                        axis: vertical
                        first:
                          axis: vertical
                          first:
                            node:
                              id: project-pulse-status
                              component: "@dash-bored/status"
                              props:
                                label: Project pulse
                                density: compact
                                source:
                                  shell: bun run .dash-bored/scripts/project-pulse.ts status
                                  cwd: .
                                  every: 30000
                          second:
                            node:
                              id: project-pulse-chart
                              component: "@dash-bored/chart"
                              props:
                                title: Package scripts by category
                                type: bar
                                source:
                                  shell: bun run .dash-bored/scripts/project-pulse.ts chart
                                  cwd: .
                                  every: 30000
                        second:
                          node:
                            id: worktree-environment
                            component: "@dash-bored/env"
                            props:
                              path: .env.worktree
                    second:
                      node:
                        id: renderer-preview
                        component: "@dash-bored/webview"
                        props:
                          url: http://127.0.0.1:5488/ui-harness.html
          - metadata:
              label: Roadmap
            node:
              id: roadmap
              component: "@dash-bored/group"
              children:
                axis: horizontal
                ratio: 0.55
                first:
                  node:
                    id: roadmap-packages
                    component: "@dash-bored/list"
                    props:
                      title: Atoms roadmap · implementation status
                      sort: source-order
                      source:
                        shell: bun run .dash-bored/scripts/roadmap.ts
                        cwd: .
                        every: 60000
                      itemActions:
                        - name: Continue with agent
                          action:
                            run: agent:prompt
                            with:
                              prompt: ${item.prompt}
                        - name: Read roadmap
                          action: reveal:roadmap-markdown
                second:
                  axis: vertical
                  first:
                    node:
                      id: todo-chart
                      component: "@dash-bored/chart"
                      props:
                        title: Todos by tag
                        type: bar
                        source:
                          shell: bun run .dash-bored/scripts/todo-stats.ts chart
                          cwd: .
                          every: 30000
                  second:
                    node:
                      id: roadmap-todos
                      component: "@dash-bored/button"
                      props:
                        variant: buttons
                        items:
                          - name: Jump to todos
                            action: reveal:yaml-todo
                          - name: Plan the next work package with agent
                            action:
                              run: agent:prompt
                              with:
                                prompt: Read docs/IDEA.md and docs/roadmap/atoms.md. Propose the smallest next work package that moves WP9 forward, with acceptance checks. Do not edit files.
          - metadata:
              label: Release
            node:
              id: release
              component: "@dash-bored/group"
              children:
                axis: vertical
                first:
                  node:
                    id: release-intro
                    component: "@dash-bored/markdown"
                    props:
                      content: |
                        **Unsigned macOS prerelease** for Apple Silicon on macOS 14+. Run the checks in order before
                        pushing a tag that exactly matches `v<package.json version>`; GitHub Actions repeats them and
                        creates a draft prerelease for explicit publication. Settings → Updates handles release notes,
                        dashboard migration, and the verified installer.
                second:
                  axis: vertical
                  first:
                    axis: horizontal
                    ratio: 0.5
                    first:
                      node:
                        id: release-controls
                        component: "@dash-bored/group"
                        props:
                          title: Release pipeline
                        children:
                          axis: vertical
                          first:
                            node:
                              id: run-release-qa
                              component: "@dash-bored/command"
                              props:
                                label: 1 · Run release QA
                                command: bun run qa && bun run dash-bored -- validate .
                                cwd: .
                          second:
                            axis: vertical
                            first:
                              node:
                                id: build-macos-release
                                component: "@dash-bored/command"
                                props:
                                  label: 2 · Build clean macOS prerelease
                                  command: bun run build:release
                                  cwd: .
                            second:
                              node:
                                id: prepare-macos-release
                                component: "@dash-bored/command"
                                props:
                                  label: 3 · Verify and stage release assets
                                  command: bun run release:prepare
                                  cwd: .
                    second:
                      axis: vertical
                      first:
                        node:
                          id: github-releases
                          component: "@dash-bored/list"
                          props:
                            title: Published GitHub releases
                            sort: source-order
                            source:
                              shell: bun run .dash-bored/scripts/releases.ts
                              cwd: .
                              every: 300000
                              timeoutMs: 10000
                      second:
                        node:
                          id: update-workflow
                          component: "@dash-bored/group"
                          props:
                            title: Updates and migrations
                            description: Canary is available; Beta and Stable come later. Nothing below installs anything.
                          children:
                            axis: vertical
                            first:
                              node:
                                id: update-check
                                component: "@dash-bored/button"
                                props:
                                  name: Open Settings to check canary releases
                                  action: app:show-settings
                            second:
                              node:
                                id: migration-inspect
                                component: "@dash-bored/command"
                                props:
                                  label: Inspect dashboard migration requirements
                                  command: bun run dash-bored -- migrate inspect .
                                  cwd: .
                  second:
                    node:
                      id: release-workflow-markdown
                      component: "@dash-bored/markdown"
                      props:
                        path: .github/workflows/release.yml
          - metadata:
              label: Agent
            node:
              id: agent-setup
              component: "@dash-bored/group"
              props:
                title: Configure with an agent
                description: Exercise the same self-contained setup flow generated for new projects.
              children:
                axis: vertical
                first:
                  node:
                    id: agent-setup-guide
                    component: "@dash-bored/markdown"
                    props:
                      content: |
                        Choose the CLI coding agent in Settings, install the version-matched dash-bored skill
                        globally or for this repository, then ask the agent to improve this cockpit. The skill ships
                        the agent tools; the app passes its bundled tool as `DASH_BORED_TOOL`. App settings override
                        the bundle environment below. The skill statuses report each install scope's check result.
                second:
                  axis: horizontal
                  ratio: 0.5
                  first:
                    axis: vertical
                    first:
                      node:
                        id: agent-environment
                        component: "@dash-bored/env"
                        props:
                          path: .dash-bored/.env
                    second:
                      node:
                        id: configure-with-agent
                        component: "@dash-bored/button"
                        props:
                          name: Configure with agent
                          action:
                            run: agent:prompt
                            with:
                              template: dashboard
                              prompt: Inspect this project and propose a scoped dashboard improvement. Use the dash-bored skill and validate any saved dashboard changes.
                  second:
                    axis: vertical
                    first:
                      node:
                        id: capture-agent-view
                        component: "@dash-bored/command"
                        props:
                          label: Capture the app window as an agent sees it
                          command: '"$DASH_BORED_TOOL" app screenshot --output "${TMPDIR:-/tmp}/dash-bored-agent-view.png" && open "${TMPDIR:-/tmp}/dash-bored-agent-view.png"'
                          cwd: .
                    second:
                      axis: vertical
                      first:
                        node:
                          id: list-agent-actions
                          component: "@dash-bored/command"
                          props:
                            label: List actions an agent can run in this app
                            command: '"$DASH_BORED_TOOL" app actions'
                            cwd: .
                      second:
                        axis: vertical
                        first:
                          axis: horizontal
                          first:
                            node:
                              id: agent-skill-global-status
                              component: "@dash-bored/status"
                              props:
                                label: Skill · global
                                density: compact
                                source:
                                  shell: if out=$(FORCE_COLOR=0 "$DASH_BORED_TOOL" install-skill --global --check 2>&1); then echo '{"state":"healthy","detail":"Installed in ~/.agents/skills/dash-bored."}'; else printf '{"state":"warning","detail":"%s"}\n' "$(printf '%s' "$out" | head -n 1 | LC_ALL=C tr -d '\000-\037\177' | sed 's/\[[0-9;]*m//g; s/[\\"]/\\&/g')"; fi
                                  cwd: .
                                  every: 5000
                          second:
                            node:
                              id: agent-skill-project-status
                              component: "@dash-bored/status"
                              props:
                                label: Skill · this repository
                                density: compact
                                source:
                                  shell: if out=$(FORCE_COLOR=0 "$DASH_BORED_TOOL" install-skill . --check 2>&1); then echo '{"state":"healthy","detail":"Installed in .agents/skills/dash-bored."}'; else printf '{"state":"warning","detail":"%s"}\n' "$(printf '%s' "$out" | head -n 1 | LC_ALL=C tr -d '\000-\037\177' | sed 's/\[[0-9;]*m//g; s/[\\"]/\\&/g')"; fi
                                  cwd: .
                                  every: 5000
                        second:
                          axis: vertical
                          first:
                            node:
                              id: install-agent-skill-global
                              component: "@dash-bored/command"
                              props:
                                label: Install or update dash-bored skill globally
                                command: '"$DASH_BORED_TOOL" install-skill --global'
                                cwd: .
                          second:
                            node:
                              id: install-agent-skill
                              component: "@dash-bored/command"
                              props:
                                label: Install or update portable dash-bored skill for this project
                                command: '"$DASH_BORED_TOOL" install-skill .'
                                cwd: .
          - metadata:
              label: Docs
            node:
              id: documentation
              component: "@dash-bored/group"
              children:
                axis: vertical
                first:
                  node:
                    id: documentation-tabs
                    component: "@dash-bored/button"
                    persistOnFocus: true
                    props:
                      variant: tabs
                      items:
                        - name: README
                          action: select:documentation-panels/readme-markdown
                        - name: Dashboard setup
                          action: select:documentation-panels/dashboard-readme
                        - name: Product vision
                          action: select:documentation-panels/idea-markdown
                        - name: Architecture
                          action: select:documentation-panels/architecture-markdown
                        - name: Atoms roadmap
                          action: select:documentation-panels/roadmap-markdown
                        - name: Components
                          action: select:documentation-panels/components-markdown
                        - name: Renderer
                          action: select:documentation-panels/renderer-markdown
                        - name: Runtime
                          action: select:documentation-panels/runtime-markdown
                        - name: Security
                          action: select:documentation-panels/security-markdown
                        - name: Release QA
                          action: select:documentation-panels/onboarding-qa-guide
                second:
                  node:
                    id: documentation-panels
                    component: "@dash-bored/selection"
                    props:
                      defaultChild: readme-markdown
                    children:
                      - metadata:
                          label: README
                        node:
                          id: readme-markdown
                          component: "@dash-bored/markdown"
                          props:
                            path: README.md
                      - metadata:
                          label: Dashboard setup
                        node:
                          id: dashboard-readme
                          component: "@dash-bored/markdown"
                          props:
                            path: .dash-bored/README.md
                      - metadata:
                          label: Product vision
                        node:
                          id: idea-markdown
                          component: "@dash-bored/markdown"
                          props:
                            path: docs/IDEA.md
                      - metadata:
                          label: Architecture
                        node:
                          id: architecture-markdown
                          component: "@dash-bored/markdown"
                          props:
                            path: ARCHITECTURE.md
                      - metadata:
                          label: Atoms roadmap
                        node:
                          id: roadmap-markdown
                          component: "@dash-bored/markdown"
                          props:
                            path: docs/roadmap/atoms.md
                      - metadata:
                          label: Components
                        node:
                          id: components-markdown
                          component: "@dash-bored/markdown"
                          props:
                            path: docs/architecture/components.md
                      - metadata:
                          label: Renderer
                        node:
                          id: renderer-markdown
                          component: "@dash-bored/markdown"
                          props:
                            path: docs/architecture/renderer.md
                      - metadata:
                          label: Runtime
                        node:
                          id: runtime-markdown
                          component: "@dash-bored/markdown"
                          props:
                            path: docs/architecture/runtime.md
                      - metadata:
                          label: Security
                        node:
                          id: security-markdown
                          component: "@dash-bored/markdown"
                          props:
                            path: docs/architecture/security.md
                      - metadata:
                          label: Release QA
                        node:
                          id: onboarding-qa-guide
                          component: "@dash-bored/markdown"
                          props:
                            path: docs/release-qa.md
          - metadata:
              label: Lab
            node:
              id: dogfood-dashboard
              component: ./dogfood
          - metadata:
              label: Focus
            node:
              id: project-focus-timer
              component: "@dash-bored/group"
              children:
                axis: vertical
                first:
                  node:
                    id: builtin-timer
                    component: "@dash-bored/focus-timer"
                    props:
                      title: Make something worth shipping
                      focusMinutes: 25
                      breakMinutes: 5
                second:
                  node:
                    id: timer-actions
                    component: "@dash-bored/button"
                    props:
                      items:
                        - name: Start or resume
                          action: component:builtin-timer:start
                        - name: Pause
                          action: component:builtin-timer:pause
                        - name: Reset
                          action: component:builtin-timer:reset
                        - name: Next session
                          action: component:builtin-timer:next
          - metadata:
              label: Themes
            node:
              id: theme-reference
              component: ./components/theme-reference
