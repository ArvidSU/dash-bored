schemaVersion: 2
name: dash-bored feature sandbox
root:
  id: dogfood-stack
  component: "@dash-bored/group"
  children:
    type: tiled
    layout:
      type: split
      axis: vertical
      ratio: 0.5
      first:
        type: child
        child:
          node:
            id: dogfood-project-vision
            component: "@dash-bored/markdown"
            props:
              path: docs/IDEA.md
      second:
        type: split
        axis: vertical
        ratio: 0.5
        first:
          type: child
          child:
            node:
              id: dogfood-runtime-controls-card
              component: "@dash-bored/card"
              props:
                title: Runtime layout controls
                description: Keep large component trees compact without changing dashboard configuration.
              children:
                type: tiled
                layout:
                  type: child
                  child:
                    node:
                      id: dogfood-runtime-controls
                      component: "@dash-bored/markdown"
                      props:
                        content: |
                          Right-click any component, or open its three-dot menu, to
                          collapse or expand it. Collapsed components keep a compact
                          name and expand action; their rendered body is temporarily
                          unmounted so nested polling and embedded surfaces stay out
                          of the way. Focus expands a component before making it the
                          temporary dashboard root.
        second:
          type: split
          axis: vertical
          ratio: 0.5
          first:
            type: child
            child:
              node:
                id: dogfood-static-chart
                component: "@dash-bored/chart"
                props:
                  title: Weekly workflow throughput
                  type: bar
                  labels:
                    - Mon
                    - Tue
                    - Wed
                    - Thu
                    - Fri
                  series:
                    - label: Checks passed
                      color: "#70e2a0"
                      values:
                        - 18
                        - 24
                        - 21
                        - 29
                        - 34
                    - label: Checks skipped
                      color: "#f4c66b"
                      values:
                        - 4
                        - 3
                        - 5
                        - 2
                        - 1
          second:
            type: split
            axis: vertical
            ratio: 0.5
            first:
              type: child
              child:
                node:
                  id: dogfood-live-chart
                  component: "@dash-bored/live-chart"
                  props:
                    title: Renderer activity sample
                    endpoint: /dash-bored-chart-fixture.json
                    pollIntervalMs: 4000
                    maxPoints: 30
            second:
              type: split
              axis: vertical
              ratio: 0.5
              first:
                type: child
                child:
                  node:
                    id: dogfood-status
                    component: "@dash-bored/status"
                    props:
                      label: Config-link boundary
                      state: healthy
                      detail: This content is loaded from .dash-bored/dogfood/dash-bored.yaml.
              second:
                type: child
                child:
                  node:
                    id: dogfood-env
                    component: "@dash-bored/env"
                    props:
                      path: .env.worktree
