name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: macOS QA
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stop Spotlight indexing
        # Spotlight indexes every file the tests create. Its mdworker processes
        # held the 3-CPU runner near a load average of 20 during the browser
        # suites, which starved Chrome and the fixture servers.
        run: sudo mdutil -a -i off

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun ci

      - name: Restore pinned dashboard packages
        run: |
          bun run packages:restore
          bun run packages:restore .dash-bored/dogfood

      - name: Run QA
        run: bun run qa

      - name: Validate the dogfooding dashboard
        run: |
          bun run dash-bored -- validate .
          bun run dash-bored -- validate .dash-bored/dogfood
