name: macOS prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build unsigned Apple Silicon prerelease
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stop Spotlight indexing
        # Same reason as ci.yml: indexing test output starves the 3-CPU runner.
        run: sudo mdutil -a -i off

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun ci

      - name: Restore pinned dashboard packages
        run: |
          bun run packages:restore
          bun run packages:restore .dash-bored/dogfood

      - name: Run release QA
        run: |
          bun run qa
          bun run dash-bored -- validate .
          bun run dash-bored -- validate .dash-bored/dogfood

      - name: Import release signing identity
        # A self-signed certificate, not a Developer ID: Gatekeeper still treats
        # the app as unidentified, but its designated requirement stays stable,
        # so Screen Recording grants survive updates.
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERTIFICATE_P12" ] || [ -z "$SIGNING_CERTIFICATE_PASSWORD" ]; then
            echo "Release signing secrets are missing; see docs/release-qa.md#release-signing-identity." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/release-signing.p12"
          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"dash-bored release signing"/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "The release signing identity was imported but is unavailable for code signing." >&2
            exit 1
          fi
          rm "$certificate"
          echo "DASH_BORED_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "DASH_BORED_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build clean unsigned macOS artifacts
        run: bun run build:release

      - name: Verify and prepare release assets
        run: bun run release:prepare -- --tag "${GITHUB_REF_NAME}"

      - name: Verify published checksum
        working-directory: release
        run: shasum -a 256 -c SHA256SUMS.txt

      - name: Preserve verified workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dash-bored-${{ github.ref_name }}-macos-arm64-unsigned
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Create immutable draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for ${GITHUB_REF_NAME}; refusing to replace its assets." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            release/*.dmg \
            release/*.app.tar.zst \
            release/*update.json \
            release/dash-bored-release.json \
            release/MIGRATIONS.md \
            release/SHA256SUMS.txt \
            --draft \
            --prerelease \
            --verify-tag \
            --title "dash-bored ${GITHUB_REF_NAME}" \
            --notes-file release/RELEASE_NOTES.md
